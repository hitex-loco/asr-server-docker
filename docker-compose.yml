# UDAAN ASR server. From this folder:
#   docker compose up --build -d
#
# ASR_MODELS_DIR is the host folder that holds the three model folders
# (see README.md). It defaults to ./models next to this file:
#   ASR_MODELS_DIR=/data/asr-models docker compose up --build -d
services:
  asr:
    build:
      # This folder is the build context; .dockerignore keeps it to
      # asr-server.py and requirements.txt (never models/).
      context: .
      dockerfile: Dockerfile

    image: udaan-asr:v8     # name:tag of the built image
    container_name: udaan-asr

    # Overrides the Dockerfile defaults; `docker compose up -d` applies a
    # change without a rebuild. NUM_WORKERS = transcriptions the Whisper model
    # runs at the same time (more workers need more GPU memory).
    environment:
      - NUM_WORKERS=2

    ports:
      - "8000:8000"

    volumes:
      - ${ASR_MODELS_DIR:-./models}:/app/models:ro

    gpus: all
    restart: unless-stopped
